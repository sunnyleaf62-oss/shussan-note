<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ママノート</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ママノート">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
:root{
  --bg:#FFFFFF; --bg2:#FAF5E9; --card:#FFFFFF; --ink:#4F3F42; --sub:#85707A; --faint:#C9BDC0;
  --line:#EFE2E1; --blue:#EDBFBF; --blue-d:#DFA4B4; --blue-l:#FAE6EA; --acc-ink:#B24C6A;
  --brown:#B4D9E2; --brown-d:#3F7F93; --brown-l:#E6F3F6;
  --serif:"Hiragino Maru Gothic ProN","Zen Maru Gothic","Yu Gothic","Noto Sans JP",sans-serif;
  --sans:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
#app{max-width:520px;margin:0 auto;padding:0 20px calc(116px + env(safe-area-inset-bottom));min-height:100vh}

/* header */
.ph{padding:30px 0 20px}
.ph h1{margin:0;font-family:var(--serif);font-size:27px;font-weight:600;letter-spacing:.05em;line-height:1.35}
.ph p{margin:6px 0 0;color:var(--sub);font-size:13px}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--acc-ink);font-size:13px;font-weight:600;margin:20px 0 0 -4px;padding:6px 6px 6px 0}
.back svg.i{width:18px;height:18px}
.back + .ph{padding-top:8px}

/* cards */
.card{background:var(--card);border-radius:26px;padding:20px;margin-bottom:16px;border:1px solid rgba(246,232,233,.95);box-shadow:0 10px 30px rgba(190,140,130,.07)}
.card h2,.card h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:.03em}
.card h3{font-size:17px}
.sub{color:var(--sub);font-size:12.5px}
.sec{font-family:var(--serif);font-size:15px;font-weight:600;margin:26px 2px 12px;color:var(--brown-d);letter-spacing:.04em}

/* hero */
.hero{background:#F3CDD2;color:var(--ink);border:0;padding:26px 24px 22px;box-shadow:0 14px 34px rgba(223,164,180,.38)}
.hero .hl{font-size:13px;opacity:.85;letter-spacing:.12em}
.hero .big{font-family:var(--serif);font-size:20px;margin:4px 0 6px;display:flex;align-items:baseline;gap:4px;white-space:nowrap}
.hero .big b{color:var(--acc-ink);font-size:64px;font-weight:500;line-height:1.1;letter-spacing:-.02em;margin-left:2px}
.hero .big b + span{margin-right:10px}
.hero .hs{font-size:15px}
.hero .hs b{font-family:var(--serif);font-size:22px;font-weight:600;margin:0 2px}
.hero .pb{background:rgba(255,253,250,.65);margin:18px 0 12px}
.hero .pb i{background:#D88CA3}
.hero .hm{display:flex;justify-content:space-between;font-size:12.5px;opacity:.9;gap:8px}
.hero .lnk{margin-top:14px;font-size:12.5px;text-decoration:underline;text-underline-offset:3px;opacity:.9}
.hero h2{font-size:19px}
.hero p{margin:6px 0 16px;font-size:13px;opacity:.9}

/* progress */
.pb{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--blue-d);border-radius:99px;min-width:0}
.pb.br i{background:var(--brown)}

/* tiles */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.tile-s{background:var(--card);border-radius:20px;padding:16px;border:1px solid rgba(246,232,233,.95);box-shadow:0 8px 24px rgba(223,164,180,.18);display:flex;flex-direction:column;gap:8px;min-height:128px}
.tile-s .t{font-size:12.5px;color:var(--sub)}
.tile-s .v{font-family:var(--serif);font-size:30px;line-height:1.15;font-weight:500}
.tile-s .v small{font-size:13px;margin-left:2px}
.tile-s .pb{margin-top:auto}
.tile-s .n{font-size:12px;color:var(--sub)}

/* link rows */
.lrow{display:flex;align-items:center;gap:14px;width:100%;padding:17px 20px;background:var(--card);border-radius:20px;margin-bottom:12px;border:1px solid rgba(246,232,233,.95);box-shadow:0 8px 24px rgba(223,164,180,.15)}
.lrow .ic{width:42px;height:42px;border-radius:14px;background:var(--blue-l);color:var(--acc-ink);display:grid;place-items:center;flex:none}
.lrow .ic.c{background:#F1E9F5;color:#7E5D8C}
.lrow .ic.d{background:#F9EDE5;color:#9A6A50}
.lrow .ic.b{background:var(--brown-l);color:var(--brown-d)}
.lrow .tt{flex:1;min-width:0}
.lrow .tt b{display:block;font-family:var(--serif);font-size:16px;font-weight:600}
.lrow .tt span{font-size:12.5px;color:var(--sub)}
.lrow > svg.i{width:18px;height:18px;color:var(--faint)}

/* buttons / inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--blue-d);color:#4F2F33;border-radius:14px;padding:13px 20px;font-weight:600;font-size:15px;letter-spacing:.04em;text-align:center}
.btn:active{transform:scale(.98)}
.btn.sm{padding:11px 16px;font-size:14px;flex:none}
.btn.block{display:flex;width:100%;margin-top:6px}
.btn.ghost{background:var(--brown-l);color:var(--brown-d)}
.btn.cream{background:var(--blue-d);color:#4F2F33}
.btn svg.i{width:18px;height:18px}
.btn-text{display:block;width:100%;text-align:center;padding:14px;font-size:14px;color:var(--sub)}
.btn-text.danger{color:#A5594B}
.in{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;color:var(--ink);min-width:0;appearance:none;-webkit-appearance:none}
.in:focus{outline:none;border-color:var(--blue)}
textarea.in{resize:vertical;line-height:1.6}
.row{display:flex;gap:10px;align-items:center}
.fl{display:block;font-size:12.5px;color:var(--sub);margin-bottom:14px}
.fl .in{margin-top:6px;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.hid{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.top-act{display:flex;justify-content:flex-end;margin:-6px 0 16px}
.empty{text-align:center;color:var(--sub);font-size:13.5px;padding:34px 12px}
.hero.empty{text-align:left;color:var(--ink);padding:26px 24px}
.hero .in{background:rgba(255,253,250,.96)}

/* checklist */
.cat{padding:0;overflow:hidden}
.cat-h{display:flex;align-items:center;gap:12px;width:100%;padding:18px 20px 12px}
.cat-h > div:first-child{flex:1;min-width:0}
.pc{font-family:var(--serif);font-size:20px;color:var(--acc-ink)}
.chev{color:var(--faint);transition:transform .2s}
.chev.up{transform:rotate(90deg)}
.chev svg.i{width:18px;height:18px}
.cat > .pb{margin:0 20px 18px}
.items{padding:0 20px 20px;border-top:1px solid var(--line)}
.it{padding:12px 0;border-bottom:1px solid var(--line)}
.itm{display:flex;align-items:center;gap:12px}
.ck{width:26px;height:26px;border-radius:50%;border:1.8px solid var(--blue-d);display:grid;place-items:center;flex:none;color:transparent;background:#fff}
.ck svg.i{width:15px;height:15px;stroke-width:2.6}
.ck.on{background:var(--blue-d);border-color:var(--blue-d);color:#4F2F33}
.tx{flex:1;min-width:0;word-break:break-all}
.done .tx{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--faint)}
.ib{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--faint);flex:none}
.ib svg.i{width:18px;height:18px}
.ib.has{color:var(--brown)}
.mp{margin:6px 0 0 38px;font-size:12.5px;color:var(--brown-d);background:var(--brown-l);border-radius:10px;padding:6px 10px;white-space:pre-wrap;word-break:break-all}
.memo{margin:10px 0 0 38px;width:calc(100% - 38px);font-size:14px}
.add{display:flex;gap:10px;margin-top:16px}
.bought{flex:none;font-size:11px;font-weight:700;background:var(--brown-l);color:var(--brown-d);padding:2px 9px;border-radius:99px}
.shop{margin:8px 0 0 38px;background:#FFF8F6;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.shop-t{display:flex;align-items:center;gap:6px}
.shop-l{font-size:11px;font-weight:700;color:var(--acc-ink)}
.shop-pr{font-size:9px;color:var(--sub);border:1px solid var(--line);border-radius:5px;padding:0 4px;line-height:1.4}
.shop-n{font-size:12px;margin-top:3px;line-height:1.4;font-weight:600}
.shop-r{display:flex;align-items:center;gap:4px;margin-top:3px;flex-wrap:wrap}
.stars{font-size:12px;letter-spacing:0;color:transparent;background:linear-gradient(90deg,#E9B44C var(--p),#EADFD6 var(--p));-webkit-background-clip:text;background-clip:text}
.shop-r b{font-family:var(--serif);font-size:12.5px;margin-left:2px}
.shop-r small{font-size:10px;color:var(--sub)}
.shop-btns{display:flex;gap:6px;margin-top:6px}
.shop-b{flex:1;text-align:center;border-radius:9px;padding:6px 4px;font-size:11.5px;font-weight:700;text-decoration:none;color:#4F2F33;background:var(--blue-d);line-height:1.4}
.shop-b.rk{background:#EDBFBF}
.shop-b.am{background:#B4D9E2}
.pinfo{margin:8px 0 0 38px}
.pinfo .lims{display:flex;flex-wrap:wrap;gap:6px}
.lim{font-size:11.5px;background:var(--bg2);color:var(--sub);padding:3px 10px;border-radius:99px;line-height:1.5}
.lim.ok{background:var(--brown-l);color:var(--brown-d)}
.lim.soon{background:#FFF1D6;color:#8A5A12;font-weight:700}
.lim.late{background:var(--blue-l);color:var(--acc-ink);font-weight:700}
.pinfo p{margin:6px 0 0;font-size:12.5px;color:var(--sub);line-height:1.65}

/* timeline */
.tl{position:relative;padding-left:24px;margin-top:6px}
.tl:before{content:"";position:absolute;left:6px;top:10px;bottom:10px;width:2px;background:var(--line)}
.tli{position:relative;width:100%;display:block;background:var(--card);border-radius:20px;padding:16px 18px;margin-bottom:14px;border:1px solid rgba(246,232,233,.95);box-shadow:0 8px 24px rgba(223,164,180,.18)}
.tli:before{content:"";position:absolute;left:-23px;top:22px;width:12px;height:12px;border-radius:50%;background:var(--card);border:3px solid var(--blue)}
.tli .d{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tli .d b{font-family:var(--serif);font-size:16px;font-weight:600}
.badge{background:var(--blue-l);color:var(--acc-ink);font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.chip{background:var(--bg);border-radius:12px;padding:6px 11px;font-family:var(--serif);font-size:16px}
.chip em{font-style:normal;font-family:var(--sans);font-size:11px;color:var(--sub);margin-right:6px}
.chip small{font-family:var(--sans);font-size:11px;color:var(--sub);margin-left:2px}
.cm{margin:12px 0 0;font-size:13.5px;color:var(--sub);white-space:pre-wrap;word-break:break-all}

/* echo */
.gal{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pt{position:relative;aspect-ratio:1;border-radius:18px;overflow:hidden;background:var(--bg2);display:block;width:100%;box-shadow:0 8px 22px rgba(190,140,130,.12)}
.pt img{width:100%;height:100%;object-fit:cover;display:block}
.pt span{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 10px;color:#FFFCF7;font-size:12px;line-height:1.4;background:linear-gradient(transparent,rgba(60,48,40,.62))}
.pt span b{display:block;font-family:var(--serif);font-size:15px;font-weight:600}
.pv img{width:100%;max-height:260px;object-fit:contain;border-radius:16px;background:var(--bg2);margin-bottom:12px;display:block}
#lb{position:fixed;inset:0;z-index:60;background:rgba(43,35,29,.94);display:none;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))}
#lb.on{display:flex}
#lb .im{flex:1;min-height:0;display:grid;place-items:center}
#lb .im img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}
#lb .info{color:#F7F2EA;padding-top:14px;max-width:520px;width:100%;margin:0 auto}
#lb .info b{font-family:var(--serif);font-size:17px;font-weight:600}
#lb .info p{margin:6px 0 0;font-size:13.5px;opacity:.85;white-space:pre-wrap;word-break:break-all}
#lb .acts{display:flex;gap:10px;margin-top:14px}
#lb .acts button{flex:1;padding:13px;border-radius:14px;background:rgba(255,252,247,.14);color:#F7F2EA;text-align:center;font-size:14px;font-weight:600}
#lb .acts .dl{color:#F0B8AB}

/* calendar */
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mh b{font-family:var(--serif);font-size:19px;font-weight:600}
.mh button{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--bg);color:var(--brown-d)}
.mh button svg.i{width:18px;height:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .w{text-align:center;font-size:11px;color:var(--sub);padding-bottom:4px}
.cal .w:first-child{color:#C07C78}
.cal .w:last-child{color:#5E9BB0}
.cal button,.cal i{aspect-ratio:1/1.34;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--serif);font-size:15px;line-height:1.1;background:var(--bg2);padding:0;position:relative;min-width:0}
.cal button small{font-size:9.5px;opacity:.72;letter-spacing:-.02em;font-family:var(--sans)}
.cal button small.wk0{opacity:1;font-weight:700}
.cal button s{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--brown-d);box-shadow:0 0 0 1.5px #FFFDFB;text-decoration:none}
.moods{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.mood-c{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:99px;background:var(--bg);font-weight:600;font-size:14px}
.mood-c u{width:16px;height:16px;border-radius:50%;display:block}
.mood-c.on{box-shadow:inset 0 0 0 2px var(--blue-d);background:var(--blue-l)}
.pvs{display:flex;align-items:center;gap:12px;margin:0 0 12px}
.pvs img{width:64px;height:64px;border-radius:12px;object-fit:cover}
.cal button.td{box-shadow:0 0 0 2px var(--blue-d)}
.cal i{background:none}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:16px;font-size:12px;color:var(--sub)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend u{width:12px;height:12px;border-radius:50%;display:inline-block}
.bars{display:flex;align-items:flex-end;gap:2px;height:96px;margin:16px 0 6px}
.bars i{flex:1;border-radius:4px 4px 2px 2px;min-width:0}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--faint)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.sum div{background:var(--bg);border-radius:14px;padding:10px 14px}
.sum small{display:block;font-size:11.5px;color:var(--sub)}
.sum b{font-family:var(--serif);font-size:20px;font-weight:600}
.dist{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--bg2);margin:18px 0 0}
.dist i{display:block;height:100%}
.mm{display:grid;grid-template-columns:44px 1fr 38px;gap:12px;align-items:center;margin-top:12px;font-size:13px}
.mm .pb{height:10px}
.mm b{font-family:var(--serif);font-size:15px;font-weight:500;text-align:right}
.mood-b{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:16px;background:var(--bg);margin-bottom:10px;font-size:16px;font-weight:600}
.mood-b u{width:26px;height:26px;border-radius:50%;display:block}
.mood-b.on{box-shadow:inset 0 0 0 2px var(--blue-d);background:var(--blue-l)}

/* diary */
.dr{display:flex;gap:14px;width:100%;padding:16px 18px;background:var(--card);border-radius:20px;margin-bottom:12px;border:1px solid rgba(246,232,233,.95);box-shadow:0 8px 24px rgba(223,164,180,.15);align-items:center}
.dr .dd{width:48px;text-align:center;flex:none}
.dr .dd b{display:block;font-family:var(--serif);font-size:26px;font-weight:500;line-height:1.1}
.dr .dd small{font-size:11px;color:var(--sub)}
.dr .tt{flex:1;min-width:0;word-break:break-all}
.dr .tt small{display:block;color:var(--acc-ink);font-size:11.5px;font-weight:600}
.dr img{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none}
.dform .pvs{display:flex;align-items:center;gap:12px;margin-top:12px}
.dform .pvs img{width:64px;height:64px;border-radius:12px;object-fit:cover}
.dform .acts{display:flex;gap:10px;margin-top:14px}
.dform .acts label{flex:none}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.on{display:block}
#sheet .bd{position:absolute;inset:0;background:rgba(75,64,56,.4)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:90vh;overflow:auto;background:var(--card);border-radius:28px 28px 0 0;padding:12px 22px calc(26px + env(safe-area-inset-bottom));animation:up .22s ease-out}
#sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 18px}
#sheet h2{font-family:var(--serif);font-size:20px;font-weight:600;margin:0 0 18px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 10px 6px}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:14px;color:#9B8780;font-size:10.5px;font-weight:600;text-align:center}
nav button.on{color:var(--acc-ink);background:var(--blue-l)}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(75,64,56,.94);color:#FFFCF7;padding:10px 18px;border-radius:99px;font-size:13px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.note{font-size:12.5px;color:var(--sub);margin:10px 0 0;line-height:1.7}
.stack > * + *{margin-top:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><main id="view"></main></div>
<nav aria-label="メインメニュー"><div id="nav"></div></nav>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="lb"></div>
<div id="toast" role="status"></div>
<input class="hid" type="file" id="imp" accept="application/json,.json">

<script>
/* ===== utils ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayS=()=>ymd(new Date());
const dn=s=>{const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)/864e5};
const WD=['日','月','火','水','木','金','土'];
const jd=(s,y=true)=>{const[a,b,c]=s.split('-').map(Number);return `${y?a+'年':''}${b}月${c}日(${WD[new Date(a,b-1,c).getDay()]})`};

function normalize(o){
  const d=defaults(); if(!o||typeof o!=='object') return d;
  const oldVer=o.listVer||1;
  const r=Object.assign(d,o);
  ['cats','checkups','echoes','wishes','procs'].forEach(k=>{if(!Array.isArray(r[k]))r[k]=d[k]});
  ['moods','diary'].forEach(k=>{if(!r[k]||typeof r[k]!=='object'||Array.isArray(r[k]))r[k]={}});
  if(typeof r.due!=='string')r.due='';
  if(typeof r.birth!=='string')r.birth='';
  if(oldVer<2){
    const done=new Set(),memo={};
    (Array.isArray(o.cats)?o.cats:[]).forEach(c=>(c.items||[]).forEach(i=>{if(i.done)done.add(i.t);if(i.memo)memo[i.t]=i.memo}));
    const nd=defaults();nd.cats.forEach(c=>c.items.forEach(i=>{if(done.has(i.t))i.done=true;if(memo[i.t])i.memo=memo[i.t]}));
    r.cats=nd.cats;
  }
  r.listVer=2;
  return r;
}
function load(){try{const t=localStorage.getItem(KEY);return t?normalize(JSON.parse(t)):defaults()}catch(e){return defaults()}}

function readImg(file,max=1000,q=.72){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q))};im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}

let PRODUCTS={updated:'',items:{}};
try{const c=localStorage.getItem('mama-products');if(c)PRODUCTS=JSON.parse(c)}catch(e){}
const RK_RE=/^https:\/\/([a-z0-9-]+\.)*(rakuten\.co\.jp|r10\.to)\//i;
const AM_RE=/^https:\/\/([a-z0-9-]+\.)*(amazon\.co\.jp|amzn\.to|amzn\.asia|a\.co|link\.amazon)\//i;
function prodList(name){
  let v=PRODUCTS&&PRODUCTS.items&&PRODUCTS.items[name];
  if(location.hash==='#demo'&&name==='チャイルドシート')v=[{name:'サンプル商品A（表示確認用）',rating:4.7,count:1234,ratingFrom:'楽天',rakuten:'https://www.rakuten.co.jp/',amazon:'https://www.amazon.co.jp/'},{name:'サンプル商品B（表示確認用）',rating:4.5,rakuten:'https://www.rakuten.co.jp/'}];
  if(!v)return[];
  return(Array.isArray(v)?v:[v]).map(p=>p&&Object.assign({},p,{rk:RK_RE.test(p.rakuten||p.url||'')?(p.rakuten||p.url):'',am:AM_RE.test(p.amazon||'')?p.amazon:''})).filter(p=>p&&(p.rk||p.am)).slice(0,3);
}
function hasProducts(){return S.cats.some(c=>c.items.some(i=>prodList(i.t).length))}
function shopHtml(i){
  return prodList(i.t).map(p=>{
    const r=parseFloat(p.rating),has=r>0,full=has?Math.min(5,Math.round(r)):0;
    return `<div class="shop"><div class="shop-t"><span class="shop-l">${esc(p.label||'ママの人気商品')}</span><span class="shop-pr">PR</span></div>
    ${p.name?`<div class="shop-n">${esc(p.name)}</div>`:''}
    ${has?`<div class="shop-r"><span class="stars" style="--p:${(r/5*100).toFixed(1)}%" aria-label="評価${r}">★★★★★</span><b>${r.toFixed(2)}</b>${p.count?`<small>（${Number(p.count).toLocaleString()}件）</small>`:''}${p.ratingFrom?`<small>${esc(p.ratingFrom)}</small>`:''}</div>`:''}
    <div class="shop-btns">${p.rk?`<a class="shop-b rk" href="${esc(p.rk)}" target="_blank" rel="noopener noreferrer sponsored">楽天で見る</a>`:''}${p.am?`<a class="shop-b am" href="${esc(p.am)}" target="_blank" rel="noopener noreferrer sponsored">Amazonで見る</a>`:''}</div></div>`}).join('');
}
function shopNote(){
  if(!hasProducts())return '';
  const all=S.cats.flatMap(c=>c.items.flatMap(i=>prodList(i.t)));
  const shops=[all.some(p=>p.rk)?'楽天市場':'',all.some(p=>p.am)?'Amazon':''].filter(Boolean).join('・');
  return `<p class="note" style="margin:0 4px 16px">「PR」の表示がある商品リンクには、アフィリエイト広告（${shops}）が含まれます。${all.some(p=>p.am)?'Amazonのアソシエイトとして、ママノートは適格販売により収入を得ています。':''}${PRODUCTS.updated?`星の評価は${esc(PRODUCTS.updated)}時点のレビュー平均です。`:''}</p>`;
}
function loadProducts(){
  try{
    if(typeof fetch!=='function'||!/^https?:$/.test(location.protocol))return;
    fetch('products.json',{cache:'no-cache'}).then(r=>r.ok?r.json():Promise.reject()).then(j=>{
      if(!j||typeof j.items!=='object')return;
      const a=JSON.stringify(j);if(a===JSON.stringify(PRODUCTS))return;
      PRODUCTS=j;try{localStorage.setItem('mama-products',a)}catch(e){}
      if(ui.view==='prep'&&!document.activeElement?.matches?.('textarea,input'))render();
    }).catch(()=>{});
  }catch(e){}
}

function spark(){
  const pts=S.checkups.filter(c=>parseFloat(c.efw)>0).sort((a,b)=>a.date.localeCompare(b.date));
  if(pts.length<2)return '';
  const W=300,H=84,p=10,vs=pts.map(c=>parseFloat(c.efw)),mn=Math.min(...vs),mx=Math.max(...vs);
  const x=i=>p+i*(W-2*p)/(pts.length-1),y=v=>mx===mn?H/2:H-p-(v-mn)/(mx-mn)*(H-2*p);
  const line=vs.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<div class="card"><h3>推定体重の推移</h3><svg viewBox="0 0 ${W} ${H}" width="100%" style="margin-top:12px;display:block" role="img" aria-label="推定体重の推移グラフ"><polyline points="${line}" fill="none" stroke="#DFA4B4" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${vs.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4" fill="#FFFDFB" stroke="#B24C6A" stroke-width="2.5"/>`).join('')}</svg><div class="axis" style="margin-top:6px"><span>${jd(pts[0].date,false)}</span><span>最新 ${Math.round(vs[vs.length-1]).toLocaleString()}g</span></div></div>`;
}

/* --- procedures (出産後の手続き) --- */
function procStat(){let t=0,d=0;S.procs.forEach(c=>{t+=c.items.length;d+=c.items.filter(i=>i.done).length});return{t,d,p:t?Math.round(d/t*100):0}}
function procCalc(i){
  if(!S.birth||!i.calc)return '';
  const[y,m,d]=S.birth.split('-').map(Number);
  if(i.calc==='d13')return ymd(new Date(y,m-1,d+13));
  if(i.calc==='d15')return ymd(new Date(y,m-1,d+15));
  if(i.calc==='y2')return ymd(new Date(y+2,m-1,d));
  return '';
}
function procExtra(i){
  let h='';
  if(i.limit)h+=`<span class="lim">期限：${esc(i.limit)}</span>`;
  const dl=procCalc(i);
  if(dl){const left=dn(dl)-dn(todayS());
    h+=i.done?`<span class="lim ok">${jd(dl)}まで</span>`:`<span class="lim ${left<0?'late':left<=3?'soon':'ok'}">${jd(dl)}まで${left>=0?`（あと${left}日）`:'（期限を過ぎています）'}</span>`}
  return (h||i.note)?`<div class="pinfo">${h?`<div class="lims">${h}</div>`:''}${i.note?`<p>${esc(i.note)}</p>`:''}</div>`:'';
}
function vProc(){
  const s=procStat();
  if(!ui.initP){ui.initP=1;S.procs.forEach(c=>ui.open[c.id]=1)}
  return subHead('出産後の手続き','赤ちゃんが生まれたあとにやること')+
  `<div class="card"><div class="row" style="justify-content:space-between;align-items:baseline"><h3>全体の達成率</h3><span class="pc" style="font-size:28px">${s.p}%</span></div><div style="margin:14px 0 8px">${pb(s.p)}</div><span class="sub">${s.d} / ${s.t} 項目が完了</span></div>

  <p class="note" style="margin:0 4px 16px">期限や条件は、自治体・勤務先・加入先によって異なります。必ず窓口や公式サイトでご確認ください。</p>`+

 closeSheet:closeSheet,
 editDue:()=>sheet(`<h2>出産予定日</h2><form data-form="due"><input class="in" type="date" name="due" value="${S.due||''}" required aria-label="出産予定日"><button class="btn block" style="margin-top:14px">保存</button></form>`),
 toggleCat:d=>{ui.open[d.id]=!ui.open[d.id];render()},
 toggleItem:d=>{const i=S[d.list||'cats'].find(c=>c.id===d.cat)?.items.find(i=>i.id===d.id);if(i){i.done=!i.done;save();render()}},
 toggleMemo:d=>{ui.memo[d.id]=!ui.memo[d.id];render()},
 delItem:d=>{const c=S[d.list||'cats'].find(c=>c.id===d.cat);const i=c?.items.find(i=>i.id===d.id);if(!i||!confirm(`「${i.t}」を削除しますか？`))return;c.items=c.items.filter(x=>x.id!==d.id);save();render()},
 newCheckup:()=>checkupSheet(),
 editCheckup:d=>checkupSheet(S.checkups.find(c=>c.id===d.id)),
 delCheckup:d=>{if(!confirm('この健診記録を削除しますか？'))return;S.checkups=S.checkups.filter(c=>c.id!==d.id);save();closeSheet();render()},
 newEcho:()=>echoSheet(),
 openEcho:d=>showLb(d.id),
 closeLb:closeLb,
 delEcho:d=>{if(!confirm('この写真を削除しますか？'))return;S.echoes=S.echoes.filter(e=>e.id!==d.id);save();closeLb();render()},
 monthPrev:()=>{let[y,m]=ui.ym;m--;if(m<0){m=11;y--}ui.ym=[y,m];render()},
 monthNext:()=>{let[y,m]=ui.ym;m++;if(m>11){m=0;y++}ui.ym=[y,m];render()},
 pickDay:d=>daySheet(d.date),
 dayMood:d=>{const v=+d.v;dayDraft.mood=dayDraft.mood===v?0:v;document.querySelectorAll('.mood-c').forEach(b=>b.classList.toggle('on',+b.dataset.v===dayDraft.mood))},
 dayPhotoClear:()=>{dayDraft.p='';$('#dpv').innerHTML=pvHtml()},
 dayClear:d=>{if(!confirm('この日のつわりと日記を消しますか？'))return;delete S.moods[d.date];delete S.diary[d.date];save();closeSheet();render()},
 toggleWish:d=>{const w=S.wishes.find(w=>w.id===d.id);if(w){w.done=!w.done;save();render()}},
 delWish:d=>{const w=S.wishes.find(w=>w.id===d.id);if(!w||!confirm(`「${w.t}」を削除しますか？`))return;S.wishes=S.wishes.filter(x=>x.id!==d.id);save();render()},
 exportData:async()=>{
  const name=`mama-note-${todayS()}.json`,file=new File([JSON.stringify(S)],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'ママノート バックアップ'});return}catch(e){if(e.name==='AbortError')return}}
  const url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('書き出しました');
 },
 importData:()=>$('#imp').click(),
 resetAll:()=>{if(!confirm('すべてのデータを削除します。この操作は取り消せません。'))return;if(!confirm('本当に削除しますか？（先にバックアップをおすすめします）'))return;S=defaults();ui.open={};ui.memo={};ui.init=0;ui.draft=null;save();render();toast('初期状態に戻しました')}
};
const F={
 due:(f,fd)=>{S.due=fd.get('due');save();closeSheet();render();toast('予定日を保存しました')},
 addItem:(f,fd)=>{const t=(fd.get('t')||'').trim();const c=S[f.dataset.list||'cats'].find(c=>c.id===f.dataset.cat);if(!t||!c)return;c.items.push({id:uid(),t,limit:'',calc:'',note:'',done:false,memo:''});save();render()},
 wish:(f,fd)=>{const t=(fd.get('t')||'').trim();if(!t)return;S.wishes.push({id:uid(),t,done:false});save();render()},
 checkup:(f,fd)=>{
  const o={id:fd.get('id')||uid(),date:fd.get('date')};['w','d','efw','bpd','fl','ac'].forEach(k=>o[k]=(fd.get(k)||'').trim());o.comment=(fd.get('comment')||'').trim();
  const i=S.checkups.findIndex(c=>c.id===o.id);if(i>=0)S.checkups[i]=o;else S.checkups.push(o);
  save();closeSheet();render();toast('保存しました')
 },
 echo:(f,fd)=>{
  if(!tmpPhoto){toast('写真を選んでください');return}
  const e={id:uid(),date:fd.get('date'),w:(fd.get('w')||'').trim(),d:(fd.get('d')||'').trim(),comment:(fd.get('comment')||'').trim(),img:tmpPhoto};
  S.echoes.push(e);if(!save()){S.echoes.pop();return}
  closeSheet();render();toast('保存しました')
 },
 dayForm:(f,fd)=>{
  const k=fd.get('date'),t=(fd.get('t')||'').trim(),m=dayDraft.mood,p=dayDraft.p,pm=S.moods[k],pd=S.diary[k];
  if(m)S.moods[k]=m;else delete S.moods[k];
  if(t||p)S.diary[k]={t,p};else delete S.diary[k];
  if(!save()){if(pm)S.moods[k]=pm;else delete S.moods[k];if(pd)S.diary[k]=pd;else delete S.diary[k];return}
  closeSheet();render();toast('保存しました')
 }
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const fn=A[el.dataset.act];if(fn)fn(el.dataset,el,e)});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();const fn=F[f.dataset.form];if(fn)fn(f,new FormData(f))});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.memo){const[L,c,i]=t.dataset.memo.split('|');const it=S[L].find(x=>x.id===c)?.items.find(x=>x.id===i);if(it){it.memo=t.value;save()}}
  else if(t.matches('[data-q]')){ui.q=t.value;$('#dlist').innerHTML=dList()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('[data-gauto]')&&t.form){const g=gest(t.value);if(g){t.form.w.value=g.w;t.form.d.value=g.d}}
  else if(t.matches('[data-birth]')){S.birth=t.value;save();render()}
  else if(t.dataset.photo){
    const f=t.files[0];if(!f)return;
    readImg(f).then(u=>{if(t.dataset.photo==='echo'){tmpPhoto=u;$('#pv').innerHTML=`<img src="${u}" alt="選択した写真">`}else{dayDraft.p=u;$('#dpv').innerHTML=pvHtml()}}).catch(()=>toast('画像を読み込めませんでした'));
  }
  else if(t.id==='imp'){
    const f=t.files[0];t.value='';if(!f)return;
    f.text().then(txt=>{
      let o;try{o=JSON.parse(txt)}catch(e){toast('JSONを読み込めませんでした');return}
      if(!o||!Array.isArray(o.cats)){toast('このファイルは使えません');return}
      if(!confirm('現在のデータをこのファイルの内容に置き換えます。よろしいですか？'))return;
      S=normalize(o);ui.open={};ui.memo={};ui.init=0;ui.draft=null;save();render();toast('読み込みました');
    });
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#lb').classList.contains('on'))closeLb();else closeSheet()}});

/* ===== PWA ===== */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});

render();
loadProducts();
</script>
</body>
</html>
